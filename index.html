<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowMark — SEO Agency Project Management by Growistan</title>
  <meta name="description" content="GrowMark, by Growistan: project management built for SEO agencies — clients, projects, tasks, keyword tracking, content calendar, backlinks, and client reporting." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <div id="app-root">
    <noscript>GrowMark requires JavaScript to run.</noscript>
  </div>

  <!-- Data layer & shared utilities -->
  <script src="js/utils.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="js/toast.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/brand.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/csv.js" defer></script>

  <!-- Reusable components -->
  <script src="js/components/dnd.js" defer></script>
  <script src="js/components/charts.js" defer></script>
  <script src="js/components/taskModal.js" defer></script>

  <!-- App shell (sidebar, topbar, search, notifications) -->
  <script src="js/app.js" defer></script>

  <!-- Views (each self-registers its route(s) with Router) -->
  <script src="js/views/onboarding.js" defer></script>
  <script src="js/views/dashboard.js" defer></script>
  <script src="js/views/clients.js" defer></script>
  <script src="js/views/projects.js" defer></script>
  <script src="js/views/keywords.js" defer></script>
  <script src="js/views/contentCalendar.js" defer></script>
  <script src="js/views/backlinks.js" defer></script>
  <script src="js/views/projectDetail.js" defer></script>
  <script src="js/views/myTasks.js" defer></script>
  <script src="js/views/reports.js" defer></script>
  <script src="js/views/team.js" defer></script>
  <script src="js/views/settings.js" defer></script>
</body>
</html>
